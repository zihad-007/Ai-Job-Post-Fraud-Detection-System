<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Job | AI Job Fraud Detection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="submit-shell">
    <!-- Animated background layers -->
    <canvas id="submit-particles"></canvas>
    <div class="submit-gradient"></div>
    <div class="submit-waves" aria-hidden="true"></div>
    <div class="floating-shapes">
        <span class="shape s1"></span>
        <span class="shape s2"></span>
        <span class="shape s3"></span>
    </div>

    <main class="submit-container">
        <section class="submit-card glass lift" id="card">
            <header class="submit-head">
                <div class="chip">Submit job post</div>
                <div class="title-wrap">
                    <p class="eyebrow">AI Job Fraud Detection</p>
                    <h1>Paste your job title or description</h1>
                    <p class="lede">We’ll run anomaly detection and surface risks in seconds.</p>
                </div>
            </header>

            <!-- Result banner (from backend) -->
            {% if result %}
            <div class="result {{ 'real' if result=='Real' else 'fake' }}">
                {{ result }}
            </div>
            {% endif %}

            <form method="POST" class="submit-form" id="submit-form">
                <div class="field floating">
                    <textarea id="job_text" name="job_text" required>{{ job_text or '' }}</textarea>
                    <label for="job_text"></label>
                    <span class="field-underline"></span>
                    <div class="char-count"><span id="charCount">{{ job_text|length if job_text else 0 }}</span> chars</div>
                </div>

                <button type="submit" class="btn-gradient" id="submit-btn">
                    <span>Analyze Job</span>
                    <i class="fa fa-paper-plane"></i>
                    <span class="ripple"></span>
                </button>
            </form>

            <footer class="submit-footer">
                <a href="{{ url_for('dashboard') }}" class="ghost-link">Back to dashboard</a>
            </footer>
        </section>
    </main>

    <script>
    // Parallax floating shapes
    const shapes = document.querySelectorAll(".shape");
    document.addEventListener("mousemove", (e) => {
        const { innerWidth, innerHeight } = window;
        const x = (e.clientX / innerWidth - 0.5) * 10;
        const y = (e.clientY / innerHeight - 0.5) * 10;
        shapes.forEach((shape, i) => {
            const depth = (i + 1) * 6;
            shape.style.transform = `translate(${x * depth}px, ${y * depth}px)`;
        });
    });

    // Floating label + validation
    const textarea = document.getElementById("job_text");
    const counter = document.getElementById("charCount");
    const form = document.getElementById("submit-form");
    const card = document.getElementById("card");

    counter.innerText = textarea.value.length;
    textarea.addEventListener("input", () => {
        counter.innerText = textarea.value.length;
        textarea.classList.toggle("has-text", textarea.value.trim().length > 0);
    });

    form.addEventListener("submit", (e) => {
        if (!textarea.value.trim()) {
            e.preventDefault();
            card.classList.remove("shake");
            void card.offsetWidth; // restart animation
            card.classList.add("shake");
            textarea.focus();
        }
    });

    // Ripple on button
    const btn = document.getElementById("submit-btn");
    btn.addEventListener("click", (e) => {
        const ripple = btn.querySelector(".ripple");
        const rect = btn.getBoundingClientRect();
        const size = Math.max(rect.width, rect.height);
        ripple.style.width = ripple.style.height = size + "px";
        ripple.style.left = e.clientX - rect.left - size / 2 + "px";
        ripple.style.top = e.clientY - rect.top - size / 2 + "px";
        ripple.classList.remove("show");
        void ripple.offsetWidth;
        ripple.classList.add("show");
    });

    // Ambient particles for live background (matches Ask/Feedback)
    const canvas = document.getElementById("submit-particles");
    if (canvas) {
        const ctx = canvas.getContext("2d");
        const particles = [];
        const maxParticles = 70;
        const dpr = window.devicePixelRatio || 1;
        let width = 0;
        let height = 0;

        const random = (min, max) => Math.random() * (max - min) + min;

        function setSize() {
            width = window.innerWidth;
            height = window.innerHeight;
            canvas.width = width * dpr;
            canvas.height = height * dpr;
            canvas.style.width = width + "px";
            canvas.style.height = height + "px";
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }

        function seedParticles() {
            particles.length = 0;
            for (let i = 0; i < maxParticles; i++) {
                particles.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    r: random(1, 3),
                    vx: random(-0.35, 0.35),
                    vy: random(-0.35, 0.35),
                    alpha: random(0.18, 0.42)
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, width, height);
            for (const p of particles) {
                p.x += p.vx;
                p.y += p.vy;

                if (p.x < -20) p.x = width + 20;
                if (p.x > width + 20) p.x = -20;
                if (p.y < -20) p.y = height + 20;
                if (p.y > height + 20) p.y = -20;

                ctx.beginPath();
                const hue = 190 + (p.x / Math.max(width, 1)) * 80;
                ctx.fillStyle = `hsla(${hue}, 80%, 65%, ${p.alpha})`;
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fill();
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener("resize", () => {
            setSize();
            seedParticles();
        });

        setSize();
        seedParticles();
        draw();
    }
    </script>
</body>
</html>
